name: MFit iOS CI & Release

on:
  push:
    branches:
      - "main"
      - "feat/ios-support"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Select stable Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Inspect Xcode and iOS Simulator runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run shared KMP iOS unit tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test

      - name: Build Kotlin iOS Simulator framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Build iOS Simulator app and Live Activity extension
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/ios/DerivedData" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

          SIM_APP="$PWD/build/ios/DerivedData/Build/Products/Debug-iphonesimulator/MFit.app"
          SIM_EXT="$SIM_APP/PlugIns/MFitLiveActivityExtension.appex"
          test -d "$SIM_APP"
          test -d "$SIM_EXT"
          echo "Verified Simulator app: $SIM_APP"
          echo "Verified Simulator extension: $SIM_EXT"

      - name: Build unsigned iOS device archive
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/ios/MFit.xcarchive" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA (AltStore / SideStore / Sideloadly)
        run: |
          REPO_ROOT="$PWD"
          APP_BUNDLE="$REPO_ROOT/build/ios/MFit.xcarchive/Products/Applications/MFit.app"
          test -d "$APP_BUNDLE"

          rm -rf "$REPO_ROOT/build/ios/ipa" "$REPO_ROOT/build/ios/MFit-ios-unsigned.ipa"
          mkdir -p "$REPO_ROOT/build/ios/ipa/Payload"
          cp -R "$APP_BUNDLE" "$REPO_ROOT/build/ios/ipa/Payload/MFit.app"

          APPEX_PATH="$REPO_ROOT/build/ios/ipa/Payload/MFit.app/PlugIns/MFitLiveActivityExtension.appex"
          if [ -d "$APPEX_PATH" ]; then
            echo "Verified embedded Widget Extension: $APPEX_PATH"
          else
            echo "::warning::MFitLiveActivityExtension.appex was not found under Payload/MFit.app/PlugIns"
          fi

          (
            cd "$REPO_ROOT/build/ios/ipa"
            zip -qry "$REPO_ROOT/build/ios/MFit-ios-unsigned.ipa" Payload
          )

          ls -lh "$REPO_ROOT/build/ios/MFit-ios-unsigned.ipa"
          unzip -l "$REPO_ROOT/build/ios/MFit-ios-unsigned.ipa" | head -n 30

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: MFit-iOS-Unsigned-IPA
          path: build/ios/MFit-ios-unsigned.ipa

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MFit ${{ github.ref_name }}
          files: build/ios/MFit-ios-unsigned.ipa
          generate_release_notes: true

      # Optional Signed Build & TestFlight Upload
      # Configure the following repository secrets to enable signed App Store builds:
      #   - APPLE_CERTIFICATE_BASE64                 : Base64-encoded Apple Distribution (.p12) certificate
      #   - APPLE_CERTIFICATE_PASSWORD               : Password for the .p12 certificate
      #   - APPLE_PROVISIONING_PROFILE_BASE64        : Base64-encoded App Store provisioning profile for com.mulocoolbot.gymtracker.iosApp
      #   - APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 : (Optional) Base64-encoded App Store provisioning profile for com.mulocoolbot.gymtracker.iosApp.MFitLiveActivityExtension
      #   - APPLE_TEAM_ID                            : Apple Developer 10-character Team ID
      #   - APP_STORE_CONNECT_API_KEY_ID             : (Optional, for TestFlight upload) App Store Connect API Key ID
      #   - APP_STORE_CONNECT_API_ISSUER_ID          : (Optional, for TestFlight upload) App Store Connect API Issuer ID
      #   - APP_STORE_CONNECT_API_KEY_BASE64         : (Optional, for TestFlight upload) Base64-encoded AuthKey_<KEY_ID>.p8
      - name: Optional signed build and TestFlight upload
        if: ${{ github.event_name != 'pull_request' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            echo "APPLE_CERTIFICATE_BASE64 is not configured; skipping signed build and TestFlight upload."
            exit 0
          fi

          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_PROVISIONING_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64, and APPLE_TEAM_ID are required when APPLE_CERTIFICATE_BASE64 is set."
            exit 1
          fi

          REPO_ROOT="$PWD"
          RUNNER_TEMP_DIR="${RUNNER_TEMP:-/tmp}/mfit-ios-signing"
          KEYCHAIN_PATH="$RUNNER_TEMP_DIR/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP_DIR/distribution.p12"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          API_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          EXPORT_DIR="$REPO_ROOT/build/ios/signed-export"
          ARCHIVE_PATH="$REPO_ROOT/build/ios/MFit-signed.xcarchive"
          EXPORT_OPTIONS_PLIST="$RUNNER_TEMP_DIR/ExportOptions.plist"
          INSTALLED_PROFILES=()
          API_KEY_FILE=""

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
            rm -rf "$RUNNER_TEMP_DIR"
            for profile in "${INSTALLED_PROFILES[@]}"; do
              rm -f "$profile"
            done
            if [ -n "$API_KEY_FILE" ]; then
              rm -f "$API_KEY_FILE"
            fi
          }
          trap cleanup EXIT

          mkdir -p "$RUNNER_TEMP_DIR" "$PROFILES_DIR" "$EXPORT_DIR"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          install_profile() {
            local b64_content="$1"
            local tmp_profile="$RUNNER_TEMP_DIR/$(uuidgen).mobileprovision"
            echo "$b64_content" | base64 --decode > "$tmp_profile"
            local uuid
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i "$tmp_profile")")"
            local name
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "$tmp_profile")")"
            local dest="$PROFILES_DIR/${uuid}.mobileprovision"
            cp "$tmp_profile" "$dest"
            INSTALLED_PROFILES+=("$dest")
            printf '%s\n' "$name"
          }

          APP_PROFILE_NAME="$(install_profile "$APPLE_PROVISIONING_PROFILE_BASE64")"
          WIDGET_PROFILE_ENTRY=""
          if [ -n "$APPLE_WIDGET_PROVISIONING_PROFILE_BASE64" ]; then
            WIDGET_PROFILE_NAME="$(install_profile "$APPLE_WIDGET_PROVISIONING_PROFILE_BASE64")"
            WIDGET_PROFILE_ENTRY=$(printf '    <key>com.mulocoolbot.gymtracker.iosApp.MFitLiveActivityExtension</key>\n    <string>%s</string>' "$WIDGET_PROFILE_NAME")
          fi

          cat > "$EXPORT_OPTIONS_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mulocoolbot.gymtracker.iosApp</key>
              <string>${APP_PROFILE_NAME}</string>
          ${WIDGET_PROFILE_ENTRY}
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            ARCHS=arm64 \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_NAME"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

          SIGNED_IPA="$(find "$EXPORT_DIR" -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$SIGNED_IPA" ]; then
            echo "::error::Signed IPA was not produced in $EXPORT_DIR"
            exit 1
          fi
          echo "Produced signed IPA: $SIGNED_IPA"

          if [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_API_ISSUER_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            mkdir -p "$API_KEYS_DIR"
            API_KEY_FILE="$API_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
            echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_FILE"
            xcrun altool --upload-app \
              --type ios \
              --file "$SIGNED_IPA" \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"
          else
            echo "App Store Connect API secrets not configured; skipping TestFlight upload."
          fi
