name: MFit CI & Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare APK filenames
        run: |
          cp app/build/outputs/apk/release/*-release.apk app/build/outputs/apk/release/MFit.apk
          for f in app/build/outputs/apk/debug/*-debug.apk; do
            if [ "$f" != "app/build/outputs/apk/debug/MFit-debug.apk" ]; then
              cp "$f" app/build/outputs/apk/debug/MFit-debug.apk
            fi
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MFit-APKs
          path: |
            app/build/outputs/apk/release/MFit.apk
            app/build/outputs/apk/debug/MFit-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MFit ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/MFit.apk
            app/build/outputs/apk/debug/MFit-debug.apk
          generate_release_notes: true
